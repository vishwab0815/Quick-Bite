name: Pull Request Checks
on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened, edited]

jobs:
  validate-pr:
    name: Validate Pull Request
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The title goes through env, never straight into the script (prevents shell injection)
      - name: PR title format (advisory)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore|perf|ci|build)(\(.+\))?:\ .+ ]]; then
            echo "✅ Conventional title: $PR_TITLE"
          else
            echo "::warning::PR title should look like 'feat(pos): add split payment' (got: $PR_TITLE)"
          fi

      - name: Database model changes (advisory)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF"...HEAD | grep -E '^Backend/models/' || true)
          if [ -n "$changed" ]; then
            echo "::warning::Model changes - check existing production data still fits:"
            echo "$changed"
          fi

      - name: No large files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          large=0
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            size=$(stat -c %s "$file")
            if [ "$size" -gt 1048576 ]; then
              echo "❌ $file is $((size / 1024)) KB (limit 1 MB)"; large=1
            fi
          done < <(git diff --name-only --diff-filter=AM "origin/$BASE_REF"...HEAD)
          [ $large -eq 0 ] && echo "✅ No files over 1 MB"
          exit $large
