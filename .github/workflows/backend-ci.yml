name: Backend CI
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Express 5 needs Node 18+; Render runs Node 20+
        node-version: [20.x, 22.x]

    defaults:
      run:
        working-directory: ./Backend

    env:
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Cache in-memory MongoDB binary
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('Backend/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      # Billing, tokens, kitchen, dashboard, menu, staff, auth - against an in-memory MongoDB
      - name: Run tests
        run: npm test

      - name: Server boots (demo mode smoke test)
        run: |
          node scripts/demo.js > demo.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3000/health | grep -q '"db":"connected"'; then
              echo "✅ Server is up and connected to the database"
              curl -fs http://localhost:3000/pos/public/info > /dev/null && echo "✅ Public API responds"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Server did not become healthy"; cat demo.log; exit 1

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      # Production dependencies only; reported but not blocking
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
