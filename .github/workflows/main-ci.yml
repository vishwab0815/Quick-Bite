name: Repository Checks
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  repo-checks:
    name: Structure & secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Required files present
        run: |
          missing=0
          for path in Backend Frontend README.md SETUP.md .gitignore Backend/.env.example Frontend/.env.example; do
            if [ -e "$path" ]; then echo "✅ $path"; else echo "❌ Missing: $path"; missing=1; fi
          done
          exit $missing

      - name: No .env files committed
        run: |
          found=$(git ls-files | grep -E '(^|/)\.env(\.[a-z]+)?$' | grep -v '\.env\.example$' || true)
          if [ -n "$found" ]; then
            echo "❌ .env files are tracked by git:"; echo "$found"; exit 1
          fi
          echo "✅ No .env files tracked"

      - name: No hardcoded secrets
        run: |
          # Real connection strings (placeholders like <password> are allowed)
          if git grep -nE 'mongodb(\+srv)?://[^<:/[:space:]]+:[^<@[:space:]]+@' -- ':!*.md' ':!*.example'; then
            echo "❌ MongoDB URI with a password found"; exit 1
          fi
          if git grep -nE 'SG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}'; then
            echo "❌ SendGrid API key found"; exit 1
          fi
          if git grep -nE 'EAA[A-Za-z0-9]{40,}'; then
            echo "❌ WhatsApp / Meta access token found"; exit 1
          fi
          echo "✅ No hardcoded secrets detected"
